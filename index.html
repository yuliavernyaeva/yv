<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Юлия Верняева</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --bg-dark: #1a1a1a;
      --bg-light: #ffffff;
      --text-light: #f5f5f5;
      --text-muted: #aaaaaa;
      --text-dark: #222222;
      --accent-gold: #c9a96e;
      --font-body: 'Inter', sans-serif;
    }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-body);
      background: var(--bg-dark);
      color: var(--text-light);
      line-height: 1.6;
      font-weight: 300;
      letter-spacing: 0.3px;
    }
    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 0 20px;
    }
    /* ========== ШАПКА ========== */
    .header-white {
      background: var(--bg-light);
      padding: 20px 0;
      margin-bottom: 40px;
    }
    .header-flex {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
    }
    .logo-wrapper .logo-text {
      font-size: 1.2rem;
      font-weight: 600;
      letter-spacing: 1.5px;
      color: var(--text-dark);
      text-transform: uppercase;
    }
    .logo-wrapper .logo-text span {
      color: var(--accent-gold);
    }
    .nav {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .nav a {
      text-decoration: none;
      color: var(--text-dark);
      font-weight: 400;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: 0.3s;
      border-bottom: 1px solid transparent;
      padding-bottom: 4px;
    }
    .nav a:hover {
      border-bottom-color: var(--accent-gold);
    }
    /* ========== КАРУСЕЛЬ ========== */
    .carousel-section {
      padding: 20px 0 50px;
      text-align: center;
    }
    .carousel-container {
      position: relative;
      overflow: hidden;
      max-width: 900px;
      margin: 0 auto 30px;
      background: var(--bg-dark);
    }
    .carousel-track {
      display: flex;
      transition: transform 0.6s ease-in-out;
    }
    .carousel-slide {
      min-width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .carousel-slide img {
      width: 100%;
      height: auto;
      max-height: 550px;
      object-fit: contain;
      display: block;
      filter: grayscale(0.1);
      transition: 0.5s;
    }
    .carousel-slide img:hover {
      filter: grayscale(0);
    }
    .carousel-dots {
      display: flex;
      justify-content: center;
      gap: 14px;
      margin-top: 20px;
    }
    .carousel-dots span {
      width: 10px;
      height: 10px;
      background: rgba(255,255,255,0.2);
      border-radius: 50%;
      cursor: pointer;
      transition: 0.3s;
    }
    .carousel-dots span.active {
      background: var(--accent-gold);
      transform: scale(1.2);
    }
    /* ========== ФРАЗА ========== */
    .carousel-quote {
      max-width: 700px;
      margin: 30px auto 20px;
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: 0.5px;
      line-height: 1.4;
      text-align: center;
    }
    .carousel-quote .gold {
      color: var(--accent-gold);
      font-weight: 400;
    }
    .carousel-quote .white {
      color: var(--text-light);
    }
    /* ========== КНОПКИ ========== */
    .story-btn,
    .contact-btn,
    .master-class-btn {
      display: inline-block;
      padding: 14px 45px;
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      transition: 0.3s;
      font-weight: 400;
      margin-top: 10px;
    }
    .story-btn:hover {
      background: var(--accent-gold);
      color: var(--bg-dark);
    }
    .master-class-btn {
      background: var(--accent-gold);
      color: var(--bg-dark);
      font-weight: 600;
    }
    .master-class-btn:hover {
      background: #b8975a;
      transform: translateY(-2px);
    }
    /* ========== БЛОК С КУКЛАМИ ========== */
    .dolls-section {
      padding: 60px 0 80px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .dolls-section .container {
      text-align: center;
    }
    .dolls-section h2 {
      font-size: 1.8rem;
      font-weight: 300;
      letter-spacing: 1px;
      margin-bottom: 30px;
      color: var(--text-light);
    }
    .dolls-section h2 span {
      color: var(--accent-gold);
      font-weight: 400;
    }
    .dolls-carousel {
      max-width: 800px;
      margin: 0 auto 35px;
    }
    .dolls-carousel .carousel-container {
      background: var(--bg-dark);
    }
    .dolls-carousel .carousel-slide img {
      max-height: 400px;
      object-fit: contain;
    }
    /* ========== НАВИГАЦИЯ (ДУБЛЬ) ========== */
    .nav-duplicate {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 30px;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid rgba(255,255,255,0.05);
    }
    .nav-duplicate a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.9rem;
      letter-spacing: 1px;
      transition: 0.3s;
      border-bottom: 1px solid transparent;
      padding-bottom: 4px;
    }
    .nav-duplicate a:hover {
      color: var(--text-light);
      border-bottom-color: var(--accent-gold);
    }
    /* ========== ПОДВАЛ ========== */
    footer {
      padding: 40px 0 60px;
      text-align: center;
      border-top: 1px solid rgba(255,255,255,0.05);
      color: var(--text-muted);
      font-weight: 300;
      font-size: 0.8rem;
      letter-spacing: 1px;
    }
    /* ========== АДАПТИВНОСТЬ ========== */
    @media (max-width: 768px) {
      .header-flex {
        align-items: center;
        text-align: center;
      }
      .nav {
        justify-content: center;
        gap: 15px;
      }
      .nav a {
        font-size: 0.85rem;
      }
      .carousel-quote {
        font-size: 1.2rem;
      }
      .carousel-slide img {
        max-height: 350px;
      }
      .dolls-carousel .carousel-slide img {
        max-height: 280px;
      }
      .nav-duplicate {
        gap: 20px;
      }
    }
    @media (max-width: 480px) {
      .carousel-quote {
        font-size: 1rem;
      }
      .carousel-slide img {
        max-height: 250px;
      }
      .dolls-carousel .carousel-slide img {
        max-height: 200px;
      }
      .dolls-section h2 {
        font-size: 1.3rem;
      }
      .nav {
        gap: 12px;
      }
      .nav a {
        font-size: 0.75rem;
      }
      .nav-duplicate {
        gap: 15px;
      }
      .nav-duplicate a {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>

<!-- ========== ШАПКА ========== -->

  <div class="container header-flex">
    <div class="logo-wrapper">
      <span class="logo-text">YULIA <span>VERNYAEVA</span></span>

<!-- ========== КАРУСЕЛЬ ========== -->
<section class="carousel-section" id="gallery">
  <div class="container">

      <div class="carousel-track" id="mainTrack">

        <div class="carousel-slide"><img src="images/3.jpg" alt="Фото 3" /></div>

    <a href="https://nenaprasno.ru/media/articles/sobytiya/borba-s-rakom-pryamoy-kishki-istoriya-yulii-vernyaevoy/" target="_blank" class="story-btn">что со мной произошло</a>

        <span class="active" onclick="goToSlide('dollsCarousel', 0)"></span>

  <div class="container">
    <p>© 2026 Юлия Верняева</p>
  </div>
</footer>

<script>
  function initCarousel(id, dotId, trackId) {
    const container = document.getElementById(id);
    const track = document.getElementById(trackId);
    const slides = track.querySelectorAll('.carousel-slide');
    const dots = document.getElementById(dotId).querySelectorAll('span');
    let current = 0;
    const total = slides.length - 1;
    let interval;

    function goTo(index, animate = true) {
      if (!animate) {
        track.style.transition = 'none';
      } else {
        track.style.transition = 'transform 0.6s ease-in-out';
      }
      current = index;
      track.style.transform = `translateX(-${current * 100}%)`;
      const activeDot = current >= total ? 0 : current;
      dots.forEach((dot, i) => dot.classList.toggle('active', i === activeDot));
    }

    function moveSlide(direction) {
      const nextIndex = current + direction;
      if (nextIndex > total) {
        goTo(total, true);
        setTimeout(() => {
          track.style.transition = 'none';
          current = 0;
          track.style.transform = 'translateX(0%)';
          dots.forEach((dot, i) => dot.classList.toggle('active', i === 0));
        }, 600);
        return;
      }
      if (nextIndex < 0) {
        goTo(0, true);
        setTimeout(() => {
          track.style.transition = 'none';
          current = total;
          track.style.transform = `translateX(-${total * 100}%)`;
          dots.forEach((dot, i) => dot.classList.toggle('active', i === total - 1));
        }, 600);
        return;
      }
      goTo(nextIndex, true);
    }

    window.moveSlide = function(carouselId, direction) {
      if (carouselId === id) {
        clearInterval(interval);
        moveSlide(direction);
        resetInterval();
      }
    };

    window.goToSlide = function(carouselId, index) {
      if (carouselId === id) {
        clearInterval(interval);
        goTo(index, true);
        resetInterval();
      }
    };

    function resetInterval() {
      clearInterval(interval);
      interval = setInterval(() => moveSlide(1), 4000);
    }

    track.style.transform = 'translateX(0%)';
    dots.forEach((dot, i) => dot.classList.toggle('active', i === 0));
    resetInterval();
  }

  document.addEventListener('DOMContentLoaded', function() {
    initCarousel('mainCarousel', 'mainDots', 'mainTrack');
    initCarousel('dollsCarousel', 'dollsDots', 'dollsTrack');
  });
</script>
</body>
</html>
